<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Bajcookies | Menu</title>
    <meta name="description" content="Bajcookies — handcrafted artisan cookies. Browse our full menu of signature, seasonal, mindful, and gourmet collections." />
    <link rel="stylesheet" href="assets/css/styles.css?v=dev" />
  </head>
  <body>
    <header class="hero">
      <div class="hero__inner">
        <div class="hero__brand">
          <div class="hero__identity">
            <img id="brand-logo" alt="Bajcookies logo" class="hero__logo" />
            <div>
              <h1 id="brand-name">Bajcookies</h1>
              <p id="brand-tagline"></p>
            </div>
          </div>
          <div id="brand-social" class="brand-social" aria-label="Contact links"></div>
        </div>
      </div>
    </header>

    <nav id="menu-nav" class="menu-nav"></nav>

    <main id="menu-root" class="menu-root"></main>

    <section class="notes">
      <h2>Order Notes</h2>
      <ul id="menu-notes"></ul>
    </section>

    <footer class="footer">
      <p>&copy; Bajcookies. All rights reserved.</p>
    </footer>

    <script src="assets/js/app.js?v=dev" defer></script>
  </body>
</html>
